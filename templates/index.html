<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Price Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;font-family:"Segoe UI",sans-serif;}
    .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;}
    .card-header{background:linear-gradient(90deg,#e94560,#0f3460);border-radius:14px 14px 0 0!important;}
    .form-control,.form-select{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:8px;}
    .form-control:focus,.form-select:focus{background:rgba(255,255,255,0.12);color:#fff;border-color:#e94560;box-shadow:0 0 0 0.2rem rgba(233,69,96,0.25);}
    .form-select option{background:#1a1a2e;color:#fff;}
    label{color:rgba(255,255,255,0.85);font-weight:500;font-size:.9rem;}
    small{color:rgba(255,255,255,0.45)!important;font-size:.78rem;}
    .btn-predict{background:linear-gradient(90deg,#e94560,#c84b31);border:none;border-radius:10px;font-weight:600;transition:all .3s;}
    .btn-predict:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(233,69,96,.4);}
    #result-card{display:none;}
    .price-display{font-size:2.4rem;font-weight:700;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .spinner-border{width:1.2rem;height:1.2rem;}
  </style>
</head>

<body class="py-5">
<div class="container" style="max-width:700px;">

  <div class="text-center mb-4">
    <h2 style="color:#fff;font-weight:700;">Car Price Predictor</h2>
    <p style="color:rgba(255,255,255,0.5);">ML-Powered Used Car Valuation</p>
  </div>

  <div class="card p-4 mb-4">
    <div class="card-header text-center mb-4 py-2">
      <h5 class="mb-0" style="color:#fff;">Enter Car Details</h5>
    </div>
    <div class="row g-3">

      <div class="col-md-6">
        <label>Present Showroom Price (Lakhs)</label>
        <input type="number" id="present_price" class="form-control" placeholder="e.g. 5.59" step="0.01" min="0"/>
        <small>Current ex-showroom price</small>
      </div>

      <div class="col-md-6">
        <label>Kilometers Driven</label>
        <input type="number" id="kms_driven" class="form-control" placeholder="e.g. 27000" min="0"/>
        <small>Total distance in km</small>
      </div>

      <div class="col-md-6">
        <label>Year of Manufacture</label>
        <input type="number" id="year" class="form-control" placeholder="e.g. 2015" min="1990" max="2024"/>
        <small>Year the car was made</small>
      </div>

      <div class="col-md-6">
        <label>Fuel Type</label>
        <select id="fuel_type" class="form-select">
          <option value="">-- Select --</option>
          <option value="2">Petrol</option>
          <option value="1">Diesel</option>
          <option value="0">CNG</option>
        </select>
      </div>

      <div class="col-md-6">
        <label>Seller Type</label>
        <select id="seller_type" class="form-select">
          <option value="">-- Select --</option>
          <option value="0">Dealer</option>
          <option value="1">Individual</option>
        </select>
      </div>

      <div class="col-md-6">
        <label>Transmission</label>
        <select id="transmission" class="form-select">
          <option value="">-- Select --</option>
          <option value="1">Manual</option>
          <option value="0">Automatic</option>
        </select>
      </div>

      <div class="col-md-6">
        <label>Number of Previous Owners</label>
        <select id="owner" class="form-select">
          <option value="0">0 — First Owner</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3+</option>
        </select>
      </div>

      <div class="col-12 mt-2">
        <button class="btn btn-predict btn-lg w-100 text-white" onclick="predict()">
          <span id="btn-text">Predict Selling Price</span>
          <span id="btn-spinner" class="spinner-border text-white ms-2" style="display:none;"></span>
        </button>
      </div>

    </div>
  </div>

  <div class="card p-4 text-center" id="result-card">
    <h5 style="color:#fff;" class="mb-1">Estimated Selling Price</h5>
    <div class="price-display" id="price-display">--</div>
    <p style="color:rgba(255,255,255,0.5);" id="price-subtitle"></p>
    <hr style="border-color:rgba(255,255,255,0.1);"/>
    <div class="row text-start" id="summary-row"></div>
  </div>

  <div class="alert alert-danger mt-3" id="error-box" style="display:none;border-radius:10px;"></div>

</div>
<script>
async function predict(){
  const fields=["present_price","kms_driven","year","fuel_type","seller_type","transmission"];
  for(let f of fields){
    if(!document.getElementById(f).value){showError("Please fill in all required fields.");return;}
  }
  const age=2024-parseInt(document.getElementById("year").value);
  const payload={
    present_price:document.getElementById("present_price").value,
    kms_driven:document.getElementById("kms_driven").value,
    fuel_type:document.getElementById("fuel_type").value,
    seller_type:document.getElementById("seller_type").value,
    transmission:document.getElementById("transmission").value,
    owner:document.getElementById("owner").value,
    car_age:age
  };
  setLoading(true);hideError();
  try{
    const res=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(data.success){showResult(data.predicted_price,payload,age);}
    else{showError(data.error);}
  }catch(e){showError("Cannot connect to server.");}
  finally{setLoading(false);}
}
function showResult(price,p,age){
  document.getElementById("price-display").textContent="Rs. "+price+" Lakhs";
  document.getElementById("price-subtitle").textContent="approx Rs. "+(price*100000).toLocaleString("en-IN");
  const fm={"0":"CNG","1":"Diesel","2":"Petrol"};
  const sm={"0":"Dealer","1":"Individual"};
  const tm={"0":"Automatic","1":"Manual"};
  document.getElementById("summary-row").innerHTML=`
    <div class="col-6"><small>Present Price</small><p style="color:#fff" class="mb-1">Rs.${p.present_price} L</p></div>
    <div class="col-6"><small>KMs Driven</small><p style="color:#fff" class="mb-1">${parseInt(p.kms_driven).toLocaleString()} km</p></div>
    <div class="col-6"><small>Car Age</small><p style="color:#fff" class="mb-1">${age} years</p></div>
    <div class="col-6"><small>Fuel Type</small><p style="color:#fff" class="mb-1">${fm[p.fuel_type]}</p></div>
    <div class="col-6"><small>Seller</small><p style="color:#fff" class="mb-1">${sm[p.seller_type]}</p></div>
    <div class="col-6"><small>Transmission</small><p style="color:#fff" class="mb-1">${tm[p.transmission]}</p></div>`;
  document.getElementById("result-card").style.display="block";
  document.getElementById("result-card").scrollIntoView({behavior:"smooth"});
}
function setLoading(on){
  document.getElementById("btn-text").textContent=on?"Predicting...":"Predict Selling Price";
  document.getElementById("btn-spinner").style.display=on?"inline-block":"none";
}
function showError(msg){const b=document.getElementById("error-box");b.textContent="⚠️ "+msg;b.style.display="block";}
function hideError(){document.getElementById("error-box").style.display="none";}
</script>
</body>
</html>
